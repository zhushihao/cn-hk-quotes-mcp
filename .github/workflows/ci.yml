name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - issue-8-oauth

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Type check
        run: npm run type-check
      - name: Format check
        run: npx oxfmt --check .
      - name: Lint
        run: npx oxlint .
