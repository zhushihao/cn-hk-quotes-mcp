name: Production OAuth Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare deployment and verify OAuth metadata
        shell: python
        run: |
          import json
          import time
          import urllib.request

          origin = "https://cn-hk-quotes-mcp.zhushihao710.workers.dev"
          resource = f"{origin}/mcp"
          auth_url = f"{origin}/.well-known/oauth-authorization-server"
          resource_url = f"{origin}/.well-known/oauth-protected-resource/mcp"

          for attempt in range(1, 31):
              try:
                  def fetch_json(url):
                      req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "quantpro-prod-oauth-smoke/1"})
                      with urllib.request.urlopen(req, timeout=10) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{url} returned HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))

                  auth = fetch_json(auth_url)
                  protected = fetch_json(resource_url)

                  assert auth.get("issuer") == origin, auth
                  assert auth.get("authorization_endpoint") == f"{origin}/authorize", auth
                  assert auth.get("token_endpoint") == f"{origin}/oauth/token", auth
                  assert auth.get("registration_endpoint") == f"{origin}/oauth/register", auth
                  assert "S256" in auth.get("code_challenge_methods_supported", []), auth
                  assert "authorization_response_iss_parameter_supported" not in auth, auth
                  scopes = set(auth.get("scopes_supported", []))
                  assert {"market:read", "offline_access"}.issubset(scopes), auth

                  assert protected.get("resource") == resource, protected
                  assert origin in protected.get("authorization_servers", []), protected
                  assert "market:read" in protected.get("scopes_supported", []), protected

                  print("PROD_OAUTH_DISCOVERY_OK")
                  print("PROD_OAUTH_ISS_ADVERTISEMENT_COMPAT_OK")
                  break
              except Exception as exc:
                  print(f"attempt {attempt}/30: {type(exc).__name__}: {exc}")
                  if attempt == 30:
                      raise
                  time.sleep(10)

      - name: Wait for deployed OAuth KV write path through one-time DCR probe
        shell: python
        run: |
          import json
          import time
          import urllib.error
          import urllib.request

          url = "https://cn-hk-quotes-mcp.zhushihao710.workers.dev/oauth/register"
          payload = json.dumps({
              "client_name": "QuantPro OAuth storage smoke",
              "redirect_uris": ["https://example.com/quantpro-oauth-smoke"],
              "token_endpoint_auth_method": "none",
              "grant_types": ["authorization_code"],
              "response_types": ["code"]
          }).encode("utf-8")

          for attempt in range(1, 31):
              request = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "quantpro-prod-oauth-storage-smoke/1"
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = json.loads(response.read().decode("utf-8"))
                      assert response.status == 201, (response.status, body)
                      assert isinstance(body.get("client_id"), str) and body["client_id"], body
                      print("PROD_OAUTH_KV_WRITE_OK")
                      print(json.dumps({"client_id_issued": True, "status": response.status}))
                      break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"attempt {attempt}/30: HTTP {exc.code}: {body[:240]}")
                  if attempt == 30:
                      raise RuntimeError(f"OAuth DCR storage probe failed after deployment wait: HTTP {exc.code}: {body[:500]}") from exc
                  time.sleep(10)

      - name: Print sanitized OAuth stage trace
        shell: python
        run: |
          import json
          import urllib.request

          url = "https://cn-hk-quotes-mcp.zhushihao710.workers.dev/__oauth_diag/latest"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "quantpro-oauth-diag-reader/1"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              body = json.loads(response.read().decode("utf-8"))
          print("SANITIZED_OAUTH_TRACE")
          print(json.dumps(body, indent=2, sort_keys=True))
