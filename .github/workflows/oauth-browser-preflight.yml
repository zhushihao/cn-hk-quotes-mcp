name: OAuth Browser Preflight

on:
  pull_request:
    paths:
      - src/oauth-entry.ts
      - scripts/oauth-browser-preflight.py
      - .github/workflows/oauth-browser-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test consent redirects with intercepted synthetic HTTP fixtures
        run: python scripts/oauth-browser-preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-browser-preflight
          path: oauth-browser-preflight.json
          if-no-files-found: warn
          retention-days: 7
