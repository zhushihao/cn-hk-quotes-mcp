name: Update QuantPro Collector quote bridge

on:
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: a-h-quote-bridge
    cancel-in-progress: true

jobs:
    update-bridge:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - name: Check out Collector source
              uses: actions/checkout@v4

            - name: Fetch quotes and update bridge issue
              run: node --experimental-strip-types scripts/manual-quote-bridge.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_URL: SOURCE_URL: https://cn-hk-quotes-mcp.zhushihao710.workers.dev/api/public/quotes
                  ISSUE_NUMBER: "1"
